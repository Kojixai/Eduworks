# /etc/nginx/sites-available/mylearn.works -> symlink into sites-enabled.
# Pre-certbot source of truth: certbot adds the TLS blocks and the 80 -> 443 redirect.
# www is canonical; the apex only redirects.
server {
    server_name mylearn.works;
    return 301 $scheme://www.mylearn.works$request_uri;
}

server {
    server_name www.mylearn.works;

    access_log /var/log/nginx/learnworks.access.log;
    error_log  /var/log/nginx/learnworks.error.log;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3091;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
